<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-кинотеатр - Рекомендации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>StreamHub / Онлайн-кинотеатр</h1>
        <h2>Модуль анализа предпочтений и истории просмотров</h2>
    </header>
    <main class="container">
        <!-- Форма добавления просмотра / оценки -->
        <section class="card">
            <h3>Добавить данные просмотра фильма</h3>
            <form id="movieForm">
                <div class="form-group">
                    <label for="movieTitle">Название фильма:</label>
                    <input type="text" id="movieTitle" required placeholder="напр. Интерстеллар">
                </div>
                <div class="form-group">
                    <label for="movieGenre">Жанр:</label>
                    <input type="text" id="movieGenre" required placeholder="напр. Фантастика">
                </div>
                <div class="form-group">
                    <label for="userRating">Оценка (1-10):</label>
                    <input type="number" id="userRating" min="1" max="10" required value="8">
                </div>
                <div class="form-group">
                    <label for="completionRate">Процент досмотра (0-100%):</label>
                    <input type="number" id="completionRate" min="0" max="100" required value="90">
                </div>
                <button type="submit" class="btn btn-primary">Сохранить сеанс</button>
            </form>
            <div id="formAlert" class="alert hidden"></div>
        </section>

        <!-- Реестр / История просмотров -->
        <section class="card">
            <div class="section-header">
                <h3>История просмотров и предпочтений</h3>
                <button id="btnRefresh" class="btn btn-secondary">Обновить</button>
            </div>
            <div id="loadingSpinner" class="spinner hidden">Загрузка данных...</div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Фильм</th>
                        <th>Жанр</th>
                        <th>Оценка</th>
                        <th>Досмотр</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="moviesTbody"></tbody>
            </table>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
